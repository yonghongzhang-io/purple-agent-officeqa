# -----------------------------------------------------------------------
# scenario.toml — AgentBeats Sprint 1 submission config
# Replace YOUR_AGENTBEATS_ID and YOUR_GITHUB_USERNAME before submitting
# -----------------------------------------------------------------------

[purple_agent]
agentbeats_id = "019d009a-ab04-7b51-b16b-85b8998092f6"   # From agentbeats.dev after registration
image = "ghcr.io/yonghongzhang-io/purple-agent-officeqa:latest"
role = "purple_agent"

[purple_agent.environment]
LLM_PROVIDER = "kimi"
KIMI_API_KEY = "${KIMI_API_KEY}"
KIMI_MODEL = "kimi-k2.5"
NEBIUS_API_KEY = "${NEBIUS_API_KEY}"
NEBIUS_API_KEY_BACKUP = "${NEBIUS_API_KEY_BACKUP}"
NEBIUS_MODEL = "Qwen/Qwen3.5-397B-A17B-fast"
ENABLE_TOOLS = "true"
OFFICEQA_USE_TOOLS = "true"
ENABLE_NUMERIC_AUDIT = "true"
ENABLE_WEB_SEARCH = "false"
KIMI_THINKING = "true"
HYBRID_ROUTING = "true"
HYBRID_HARD_PROVIDER = "nebius"
HYBRID_HARD_MODEL = "Qwen/Qwen3.5-397B-A17B-fast"
HYBRID_CROSSCHECK_PROVIDER = "kimi"
HYBRID_CROSSCHECK_MODEL = "kimi-k2.5"
MAX_SOURCE_FILES = "6"
SOURCE_PREVIEW_CHARS = "20000"
SOURCE_MAX_CHARS = "35000"
MAX_LLM_CALLS = "8"
MAX_API_RETRIES = "2"
LLM_MAX_CONCURRENCY = "2"
MAX_TOKENS = "10000"
NUM_ROLLOUTS = "3"
VOTE_TEMPERATURE = "0.3"
CODE_TIMEOUT = "30"
